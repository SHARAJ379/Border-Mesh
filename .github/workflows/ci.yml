name: CI

# Runs the backend and frontend test suites (plus lint/typecheck) on every
# push and PR -- previously these only ran when someone remembered to run
# them locally (282 backend + 67 frontend tests existed with no gate
# enforcing them on a push). This doesn't change what's tested, only when.

on:
  push:
    branches: [main, full-redesign-v1]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies (Tesseract OCR, OpenCV runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt
          # facenet-pytorch's declared pins are years stale and conflict with
          # the modern stack above, even though its code runs fine against
          # them -- see backend/requirements.txt's own comment and README
          # section 7.
          pip install --no-deps "facenet-pytorch>=2.6.0"

      - name: Run backend test suite
        working-directory: backend
        run: python -m pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck + build
        working-directory: frontend
        run: npm run build

      - name: Run frontend test suite
        working-directory: frontend
        run: npm test

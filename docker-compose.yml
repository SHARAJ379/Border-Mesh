services:
  postgres:
    image: postgres:16-alpine
    container_name: bordermesh-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bordermesh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bordermesh"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bordermesh-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bordermesh
      - ENVIRONMENT=development
      - DEMO_MODE=true
      - SECRET_KEY=bordermesh-sih2026-demo-secret-key-change-in-production
      # Symmetric key encrypting biometric artifacts at rest (see
      # backend/app/core/encryption.py) -- a real Fernet key from an env
      # var, not hardcoded in source, but still a single static demo key:
      # no rotation, no envelope encryption, no HSM/KMS. Generated once via
      # `python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"`.
      # Change this in any real deployment.
      - BIOMETRIC_ENCRYPTION_KEY=GIdlRJ4jkqQin6vgx8uDRtGQ2EXnGhbd_jIXGEjS848=
      - UPLOAD_DIR=/app/uploads
      - OCR_ENGINE=pytesseract
      - TESSERACT_PATH=/usr/bin/tesseract
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bordermesh-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  uploads_data:
